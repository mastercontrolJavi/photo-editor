[workspace]
resolver = "2"
members = ["crates/pipeline", "crates/app"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false

[profile.dev]
# Image math is unbearably slow unoptimised; keep debug builds usable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
